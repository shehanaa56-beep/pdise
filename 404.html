<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) | SINET Education</title>
  <meta name="description" content="The page you are looking for does not exist. Explore our Diploma in Data Analytics & Business Intelligence courses and student placements at SINET Education.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .error-card {
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    .logo-link {
      display: inline-block;
      margin-bottom: 2rem;
    }
    .logo-img {
      height: 40px;
      width: auto;
      display: block;
      margin: 0 auto;
    }
    .error-code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 4rem;
      font-weight: 800;
      color: #2563EB;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    .error-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 0.75rem;
    }
    .error-desc {
      font-size: 1rem;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #2563EB;
      color: #FFFFFF;
      border: 1.5px solid #2563EB;
    }
    .btn-primary:hover, .btn-primary:focus {
      background: #1D4ED8;
      border-color: #1D4ED8;
      color: #FFFFFF;
    }
    .btn-secondary {
      background: #EFF6FF;
      color: #1E40AF;
      border: 1.5px solid #BFDBFE;
    }
    .btn-secondary:hover, .btn-secondary:focus {
      background: #DBEAFE;
      color: #1E3A8A;
    }
  </style>
</head>
<body>

  <main class="error-card" role="main">
    <a href="course-details.html" class="logo-link" aria-label="SINET Education Homepage">
      <img src="images/sinet.webp" alt="SINET Education" class="logo-img" width="130" height="40">
    </a>
    
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Page Not Found</h2>
    <p class="error-desc">
      The page you requested could not be found. You can return to our course details or explore student placements.
    </p>

    <div class="btn-group">
      <a href="course-details.html" class="btn btn-primary">
        Go to Course Details &rarr;
      </a>
      <a href="it-students.html" class="btn btn-secondary">
        View Placed Students
      </a>
    </div>
  </main>

</body>
</html>
